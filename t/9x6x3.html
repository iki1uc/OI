<!DOCTYPE html>
<html>
<head>
  <title>TP9 – 9x6x3 CHECK</title>
</head>
<body>
<script>
  // --- TP9-Werte ---
  const AXIS = "IN";     // muss IN sein
  const BP   = "High";   // High = maximale Stufe

  const tp9OK = (AXIS === "IN" && BP === "High");

  // --- TP6-Werte ---
  const axisValid = ["OUT", "IN", "EXX"].includes(AXIS);
  const bpValid   = ["Start", "Mid", "High"].includes(BP);

  const tp6OK = axisValid && bpValid;

  // --- TP3-Werte ---
  const A = 1;
  const B = 1;
  const C = 1;

  const tp3OK = (A === 1 && B === 1 && C === 1);

  // --- TP9 entscheidet ---
  if (tp9OK && tp6OK && tp3OK) {
      // Alles gültig → TP9 VIEW
      window.location.href = "index.html";
  } else {
      document.body.innerText =
        "TP9 BLOCKIERT – 9x6x3 nicht vollständig.";
  }
</script>
</body>
</html>
